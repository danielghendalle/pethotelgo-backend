upstream pethotelgo_api {
    server api:8080;
    keepalive 32;
}

upstream pethotelgo_frontend {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Allow Let's Encrypt ACME challenge for SSL certificate issuance
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API — proxy to Spring Boot
    location /api/ {
        proxy_pass http://pethotelgo_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        client_max_body_size 10m;
    }

    # Frontend — proxy to React app (served by Nginx container)
    location / {
        proxy_pass http://pethotelgo_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
