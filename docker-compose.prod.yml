version: '3.8'

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pethotel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pethotel-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pethotelgo:latest
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env.prod
    environment:
      # Make sure these env vars are defined in .env.prod
      - JDBC_DATABASE_URL=jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-pethotel}
      - JDBC_DATABASE_USERNAME=${POSTGRES_USER}
      - JDBC_DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=prod
      - PORT=8080
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - HIKARI_MAX_POOL_SIZE=${HIKARI_MAX_POOL_SIZE:-10}
    ports:
      - "8080:8080"
    networks:
      - pethotel-network

volumes:
  postgres-data:

networks:
  pethotel-network:
    driver: bridge

