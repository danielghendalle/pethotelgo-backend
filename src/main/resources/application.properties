spring.application.name=pethotelgo
# Server Configuration
server.port=8080
server.servlet.context-path=/api
# Database Configuration (PostgreSQL - Development)
spring.datasource.url=jdbc:postgresql://localhost:5432/pethotel
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Flyway
spring.flyway.enabled=false
# Firebase Configuration
firebase.use_adc=false
# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
# Swagger
app.swagger.enabled=true
# Logging
logging.level.root=INFO
logging.level.com.api.pethotelgo=DEBUG
logging.level.org.springframework.security=DEBUG
firebase.credentials.path=/Users/daniel/Projetos/ProjetoPetHotelGO/pethotelgo/src/main/resources/firebase-service-account.json
