spring.application.name=pethotelgo
# Server Configuration
server.port=8080
server.servlet.context-path=/api
# File uploads — vaccination cards are limited to 10 MB by VaccinationCardServiceImpl,
# which returns a friendly 413. Keep the multipart ceiling a little above that so the
# service check (not the container) is what rejects a slightly-oversized file.
# Spring Boot defaults are only 1 MB/file and 10 MB/request, which would 413 a phone photo.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=15MB
# Database Configuration (MySQL - Development)
spring.datasource.url=jdbc:mysql://localhost:3306/pethotel
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=pethotel
spring.datasource.password=pethotel
# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Flyway
spring.flyway.enabled=false
# JWT — dev-only secret; production MUST override app.jwt.secret via env var
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi1wZXRob3RlbGdvLTIwMjU=}
app.jwt.expiration-ms=${JWT_EXPIRATION:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}
# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
# Swagger
app.swagger.enabled=true
# Logging
logging.level.root=INFO
logging.level.com.api.pethotelgo=DEBUG
logging.level.org.springframework.security=DEBUG
