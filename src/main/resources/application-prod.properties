# Production application properties - PetHotelGo
# Use environment variables for sensitive values

# Spring
spring.application.name=pethotelgo

# Datasource - PostgreSQL (use env vars for credentials)
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/pethoteldb}
spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}xx

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Server
server.port=${PORT:8080}

# Actuator - expose only health and info; protect endpoints in prod
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.api.pethotelgo=INFO

# Security
# Disable H2 console in production
spring.h2.console.enabled=false

# CORS allowed origins can be set via env var
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# If app.cors.allowed-origins is empty, operator must set it to a comma-separated list of allowed origins
# Example: app.cors.allowed-origins=https://app.example.com,https://admin.example.com

# Rate limiting / brute force protection - placeholders for infra (e.g. API gateway)
security.rate-limit.login-attempts=5
security.rate-limit.login-window-minutes=15

# Database migration tool - recommend using Flyway (not configured here)
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration

# Swagger UI
app.swagger.enabled=false

# Firebase credentials - path is optional when FIREBASE_CREDENTIALS_BASE64 env var is set
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
