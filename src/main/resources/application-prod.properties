# Production application properties - PetHotelGo
# Use environment variables for sensitive values

# Spring
spring.application.name=pethotelgo

# Datasource - MySQL (use env vars for credentials)
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/pethotel}
spring.datasource.username=${JDBC_DATABASE_USERNAME:pethotel}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:pethotel}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Server
server.port=${PORT:8080}

# Behind Nginx / Cloudflare Worker: trust X-Forwarded-* so the app sees the real
# scheme/host (correct actuator links, redirects and logs). App is stateless (JWT
# HMAC) so this is defence-in-depth, not load-bearing.
server.forward-headers-strategy=framework

# Actuator - expose only health and info; protect endpoints in prod
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.api.pethotelgo=INFO

# CORS allowed origins can be set via env var
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# If app.cors.allowed-origins is empty, operator must set it to a comma-separated list of allowed origins
# Example: app.cors.allowed-origins=https://app.example.com,https://admin.example.com

# Rate limiting / brute force protection - placeholders for infra (e.g. API gateway)
security.rate-limit.login-attempts=5
security.rate-limit.login-window-minutes=15

# Database migration tool - recommend using Flyway (not configured here)
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration

# Swagger UI
app.swagger.enabled=false

# JWT - no default: the app fails fast if JWT_SECRET is not provided
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# Flyway - apply schema migrations on startup
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
